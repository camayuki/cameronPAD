{% extends "base.html" %}

{% block title %}Login - CameronPAD{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card card">
        <div class="login-header">
            <h1>🌌 Welcome to CameronPAD</h1>
            <p>Enter your credentials to access the space</p>
        </div>

        {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="post" action="/auth/login" class="login-form">
            <input type="hidden" name="next" value="{{ next or '/' }}">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    class="form-input" 
                    required 
                    placeholder="Enter your username"
                    value="{{ username or '' }}"
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    class="form-input" 
                    required 
                    placeholder="Enter your password"
                >
            </div>

            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember" class="checkbox">
                    <span class="checkmark"></span>
                    Remember me for 30 days
                </label>
            </div>

            <button type="submit" class="btn btn-primary login-btn">
                <span class="btn-icon">🚀</span>
                Launch into CameronPAD
            </button>
        </form>

        <div class="login-footer">
            <p>Need access? Contact your administrator.</p>
        </div>
    </div>
</div>

<style>
    .login-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 80vh;
        padding: 2rem;
    }

    .login-card {
        max-width: 450px;
        width: 100%;
        text-align: center;
        position: relative;
        background: rgba(26, 31, 53, 0.9);
        backdrop-filter: blur(20px);
        border: 1px solid var(--border-color);
        box-shadow: 
            0 20px 40px rgba(0, 0, 0, 0.4),
            0 0 50px rgba(79, 195, 247, 0.1);
    }

    .login-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary), var(--accent-primary));
        animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
        from {
            box-shadow: 0 0 5px var(--glow-color);
        }
        to {
            box-shadow: 0 0 20px var(--glow-color), 0 0 30px var(--purple-glow);
        }
    }

    .login-header h1 {
        color: var(--accent-primary);
        font-size: 2.5rem;
        margin-bottom: 0.5rem;
        font-weight: 700;
        text-shadow: 0 0 10px rgba(79, 195, 247, 0.5);
    }

    .login-header p {
        color: var(--text-secondary);
        margin-bottom: 2rem;
        font-size: 1.1rem;
    }

    .login-form {
        text-align: left;
    }

    .login-form .form-input {
        background: rgba(45, 53, 97, 0.6);
        border: 1px solid var(--border-color);
        transition: all 0.3s ease;
    }

    .login-form .form-input:focus {
        background: rgba(45, 53, 97, 0.8);
        border-color: var(--accent-primary);
        box-shadow: 
            0 0 0 3px rgba(79, 195, 247, 0.1),
            0 0 15px rgba(79, 195, 247, 0.2);
    }

    .checkbox-label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        cursor: pointer;
        color: var(--text-secondary);
        font-size: 0.9rem;
    }

    .checkbox {
        appearance: none;
        width: 18px;
        height: 18px;
        border: 2px solid var(--border-color);
        border-radius: 4px;
        position: relative;
        background: var(--secondary-bg);
        transition: all 0.3s ease;
    }

    .checkbox:checked {
        background: var(--accent-primary);
        border-color: var(--accent-primary);
    }

    .checkbox:checked::after {
        content: '✓';
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 12px;
        font-weight: bold;
    }

    .login-btn {
        width: 100%;
        padding: 1rem;
        font-size: 1.1rem;
        font-weight: 600;
        margin-top: 1rem;
        background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        position: relative;
        overflow: hidden;
    }

    .login-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
        transition: left 0.5s;
    }

    .login-btn:hover::before {
        left: 100%;
    }

    .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 
            0 10px 25px rgba(79, 195, 247, 0.4),
            0 0 30px rgba(79, 195, 247, 0.3);
    }

    .btn-icon {
        font-size: 1.2rem;
        margin-right: 0.5rem;
    }

    .login-footer {
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid var(--border-color);
    }

    .login-footer p {
        color: var(--text-secondary);
        font-size: 0.9rem;
    }

    /* Floating animation for the card */
    .login-card {
        animation: float 6s ease-in-out infinite;
    }

    @keyframes float {
        0%, 100% {
            transform: translateY(0px);
        }
        50% {
            transform: translateY(-10px);
        }
    }

    /* Responsive design */
    @media (max-width: 768px) {
        .login-container {
            padding: 1rem;
        }

        .login-header h1 {
            font-size: 2rem;
        }

        .login-card {
            padding: 1.5rem;
        }
    }
</style>
{% endblock %}

{% block scripts %}
<script>
    // Focus first input on load
    document.addEventListener('DOMContentLoaded', function() {
        const usernameInput = document.getElementById('username');
        if (usernameInput) {
            usernameInput.focus();
        }
    });

    // Add enter key handling
    document.addEventListener('keypress', function(event) {
        if (event.key === 'Enter') {
            const form = document.querySelector('.login-form');
            if (form) {
                form.submit();
            }
        }
    });

    // Add loading state to button on submit
    document.querySelector('.login-form').addEventListener('submit', function() {
        const button = document.querySelector('.login-btn');
        button.innerHTML = '<div class="loading"></div> Launching...';
        button.disabled = true;
    });
</script>
{% endblock %}
