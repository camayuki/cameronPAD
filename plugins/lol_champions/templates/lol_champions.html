<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL Champions - CameronPAD</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: #1a1a2e;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    color: #e0e0e0;
}

.container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px;
}

.header {
    text-align: center;
    color: #f0f0f0;
    margin-bottom: 30px;
    position: relative;
}

.back-button {
    position: absolute;
    left: 0;
    top: 10px;
    background: rgba(102, 126, 234, 0.2);
    color: #667eea;
    border: 2px solid #667eea;
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    font-weight: 600;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-block;
}

.back-button:hover {
    background: #667eea;
    color: white;
}

.header h1 {
    font-size: 3em;
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

.filters {
    background: #16213e;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}

.filter-row {
    display: flex;
    gap: 15px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.filter-group {
    flex: 1;
    min-width: 200px;
}

.filter-group label {
    display: block;
    font-weight: 600;
    margin-bottom: 5px;
    color: #e0e0e0;
}

.filter-group select, .filter-group input {
    width: 100%;
    padding: 10px;
    border: 2px solid #0f3460;
    border-radius: 8px;
    font-size: 14px;
    background: #1a1a2e;
    color: #e0e0e0;
}

.filter-group input[type="range"] {
    padding: 0;
    height: 8px;
    background: #0f3460;
    cursor: pointer;
}

.filter-group input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    width: 20px;
    height: 20px;
    background: #667eea;
    border-radius: 50%;
    cursor: pointer;
}

.filter-group input[type="range"]::-moz-range-thumb {
    width: 20px;
    height: 20px;
    background: #667eea;
    border-radius: 50%;
    cursor: pointer;
    border: none;
}

.filter-group select:focus, .filter-group input:focus {
    outline: none;
    border-color: #667eea;
}

.stats {
    text-align: center;
    padding: 15px;
    background: #16213e;
    border-radius: 8px;
    margin-bottom: 20px;
    border: 1px solid #0f3460;
}

.stats-count {
    font-size: 1.5em;
    font-weight: bold;
    color: #667eea;
}

#championGrid {
    display: grid !important;
    grid-template-columns: repeat(10, 1fr);
    gap: 20px !important;
    margin-bottom: 40px !important;
    width: 100% !important;
    padding: 0 !important;
}

.champion-card {
    background: #16213e !important;
    border-radius: 12px !important;
    overflow: hidden !important;
    cursor: pointer !important;
    transition: transform 0.2s, box-shadow 0.2s !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3) !important;
    display: block !important;
    width: 100% !important;
    border: 1px solid #0f3460 !important;
}

.champion-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 16px rgba(102, 126, 234, 0.4);
    border-color: #667eea;
}

.champion-img {
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    object-fit: cover;
}

.champion-info {
    padding: 12px;
}

.champion-name {
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 5px;
    color: #f0f0f0;
}

.hide-names .champion-name {
    font-size: 12px !important;
}

.hide-names .champion-title,
.hide-names .champion-tags {
    display: none !important;
}

.champion-title {
    font-size: 12px;
    color: #a0a0a0;
    margin-bottom: 8px;
}

.champion-tags {
    display: flex;
    gap: 5px;
    flex-wrap: wrap;
}

.tag {
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
}

.tag-assassin { background: #ff4757; color: white; }
.tag-fighter { background: #ff6348; color: white; }
.tag-mage { background: #5f27cd; color: white; }
.tag-marksman { background: #00d2d3; color: white; }
.tag-support { background: #10ac84; color: white; }
.tag-tank { background: #2e86de; color: white; }

.loading {
    text-align: center;
    padding: 60px;
    color: #e0e0e0;
    font-size: 1.5em;
}

.error {
    background: #ff4757;
    color: white;
    padding: 20px;
    border-radius: 8px;
    text-align: center;
    margin: 20px 0;
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.8);
}

.modal.show { display: flex; align-items: center; justify-content: center; }

.modal-content {
    background: #16213e;
    border-radius: 16px;
    max-width: 1400px;
    width: 98%;
    max-height: 98vh;
    overflow-y: auto;
    position: relative;
    border: 1px solid #0f3460;
}

.modal-header {
    position: relative;
    height: 200px;
    background-size: cover;
    background-position: center;
    border-radius: 16px 16px 0 0;
}

.modal-close {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(0,0,0,0.7);
    color: white;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 24px;
    cursor: pointer;
    z-index: 10;
    transition: background 0.2s;
}

.modal-close:hover {
    background: rgba(0,0,0,0.9);
}

.modal-body {
    padding: 30px;
    max-height: calc(90vh - 200px);
    overflow-y: auto;
}

.modal-title {
    font-size: 2em;
    margin-bottom: 5px;
    color: #f0f0f0;
}

.modal-subtitle {
    color: #a0a0a0;
    margin-bottom: 20px;
}

.modal-stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin: 20px 0;
}

.stat-box {
    background: #1a1a2e;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    border: 1px solid #0f3460;
}

.stat-label {
    font-size: 12px;
    color: #a0a0a0;
    margin-bottom: 5px;
}

.stat-value {
    font-size: 24px;
    font-weight: bold;
    color: #667eea;
}

.hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <a href="/" class="back-button">← Back to Dashboard</a>
        <h1>🎮 League of Legends Champions</h1>
        <p>Browse all champions from Riot Games' Data Dragon API</p>
    </div>

    <div class="filters">
        <div class="filter-row">
            <div class="filter-group">
                <label for="searchInput">Search champions (name, title, id)...</label>
                <input type="text" id="searchInput" placeholder="Search champions (name, title, id)...">
            </div>
            <div class="filter-group">
                <label>Cols</label>
                <input type="number" id="colsInput" min="3" max="30" value="10" style="width: 80px;">
            </div>
            <div class="filter-group">
                <label for="sortSelect">Sort</label>
                <select id="sortSelect">
                    <option value="name">Name</option>
                    <option value="name-desc">Name (Z-A)</option>
                    <option value="attack">Attack</option>
                    <option value="defense">Defense</option>
                    <option value="magic">Magic</option>
                    <option value="difficulty">Difficulty</option>
                </select>
            </div>
            <div class="filter-group">
                <button id="ascDescBtn" style="padding: 10px 20px; cursor: pointer; border: 2px solid #667eea; background: white; border-radius: 8px; font-weight: 600;">Asc</button>
            </div>
            <div class="filter-group">
                <label style="display: flex; align-items: center; gap: 5px; cursor: pointer;">
                    <input type="checkbox" id="hideNames"> Hide names
                </label>
            </div>
        </div>
        
        <div class="filter-row">
            <div class="filter-group">
                <label style="font-weight: 600; margin-bottom: 8px; display: block;">Show:</label>
                <label style="display: inline-flex; align-items: center; gap: 5px; margin-right: 15px; cursor: pointer;">
                    <input type="radio" name="show" value="champions" checked> Champions
                </label>
                <label style="display: inline-flex; align-items: center; gap: 5px; margin-right: 15px; cursor: pointer;">
                    <input type="radio" name="show" value="objectives"> Objectives
                </label>
                <label style="display: inline-flex; align-items: center; gap: 5px; cursor: pointer;">
                    <input type="radio" name="show" value="both"> Both
                </label>
            </div>
        </div>
        
        <div class="filter-row">
            <div class="filter-group">
                <label style="font-weight: 600; margin-bottom: 8px; display: block;">Show lanes:</label>
                <label style="display: inline-flex; align-items: center; gap: 5px; margin-right: 15px; cursor: pointer;">
                    <input type="checkbox" class="lane-filter" value="Top" checked> Top
                </label>
                <label style="display: inline-flex; align-items: center; gap: 5px; margin-right: 15px; cursor: pointer;">
                    <input type="checkbox" class="lane-filter" value="Jungle" checked> Jungle
                </label>
                <label style="display: inline-flex; align-items: center; gap: 5px; margin-right: 15px; cursor: pointer;">
                    <input type="checkbox" class="lane-filter" value="Mid" checked> Mid
                </label>
                <label style="display: inline-flex; align-items: center; gap: 5px; margin-right: 15px; cursor: pointer;">
                    <input type="checkbox" class="lane-filter" value="ADC" checked> ADC
                </label>
                <label style="display: inline-flex; align-items: center; gap: 5px; cursor: pointer;">
                    <input type="checkbox" class="lane-filter" value="Support" checked> Support
                </label>
            </div>
        </div>
        
        <div class="filter-row">
            <div class="filter-group">
                <label style="font-weight: 600; margin-bottom: 8px; display: block;">Range:</label>
                <label style="display: inline-flex; align-items: center; gap: 5px; margin-right: 15px; cursor: pointer;">
                    <input type="radio" name="range" value="all" checked> All
                </label>
                <label style="display: inline-flex; align-items: center; gap: 5px; margin-right: 15px; cursor: pointer;">
                    <input type="radio" name="range" value="melee"> Melee
                </label>
                <label style="display: inline-flex; align-items: center; gap: 5px; cursor: pointer;">
                    <input type="radio" name="range" value="ranged"> Ranged
                </label>
            </div>
        </div>
        
        <div class="filter-row">
            <div class="filter-group">
                <label style="font-weight: 600; margin-bottom: 8px; display: block;">Damage:</label>
                <label style="display: inline-flex; align-items: center; gap: 5px; margin-right: 15px; cursor: pointer;">
                    <input type="radio" name="damage" value="all" checked> ALL
                </label>
                <label style="display: inline-flex; align-items: center; gap: 5px; margin-right: 15px; cursor: pointer;">
                    <input type="radio" name="damage" value="ad"> AD
                </label>
                <label style="display: inline-flex; align-items: center; gap: 5px; margin-right: 15px; cursor: pointer;">
                    <input type="radio" name="damage" value="ap"> AP
                </label>
                <label style="display: inline-flex; align-items: center; gap: 5px; cursor: pointer;">
                    <input type="radio" name="damage" value="hybrid"> HYBRID
                </label>
            </div>
        </div>
    </div>

    <div class="stats">
        <span class="stats-count" id="championCount">Loading...</span>
    </div>

    <div id="loadingMessage" class="loading">
        Loading champions from Data Dragon...
    </div>

    <div id="errorMessage" class="error hidden"></div>

    <div id="championGrid"></div>
</div>

<!-- Modal -->
<div id="championModal" class="modal">
    <div class="modal-content">
        <div class="modal-header" id="modalHeader">
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<script>
let allChampions = [];
let filteredChampions = [];
let currentVersion = '';
let isAscending = true;

// Champion data with parsetypes for filtering
const championParseTypes = {
    // This would need to be populated with actual data from the API
    // For now, we'll use tags as a proxy for lanes/roles
};

// Fetch latest Data Dragon version
async function getLatestVersion() {
    try {
        console.log('Fetching Data Dragon version...');
        const response = await fetch('https://ddragon.leagueoflegends.com/api/versions.json');
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        const versions = await response.json();
        console.log('Latest version:', versions[0]);
        return versions[0];
    } catch (error) {
        console.error('Error fetching version:', error);
        return '14.20.1'; // Fallback to a known working version
    }
}

// Fetch all champions
async function loadChampions() {
    try {
        console.log('Loading champions...');
        currentVersion = await getLatestVersion();
        
        const champUrl = `https://ddragon.leagueoflegends.com/cdn/${currentVersion}/data/en_US/champion.json`;
        console.log('Fetching from:', champUrl);
        
        const response = await fetch(champUrl);
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        console.log('Champions data received:', Object.keys(data.data).length, 'champions');
        
        allChampions = Object.values(data.data);
        filteredChampions = [...allChampions];
        
        document.getElementById('loadingMessage').classList.add('hidden');
        renderChampions();
        updateStats();
    } catch (error) {
        console.error('Error loading champions:', error);
        document.getElementById('loadingMessage').textContent = 'Error: ' + error.message;
        document.getElementById('errorMessage').textContent = 'Failed to load champions from Riot API. Error: ' + error.message;
        document.getElementById('errorMessage').classList.remove('hidden');
    }
}

// Mock objectives data (Baron, Dragon, Herald, etc.)
const objectives = [
    { id: 'Baron', name: 'Baron Nashor', title: 'The Exalted One', tags: ['Objective'], info: {attack: 10, defense: 10, magic: 5, difficulty: 10} },
    { id: 'Dragon', name: 'Elder Dragon', title: 'Ancient Drake', tags: ['Objective'], info: {attack: 8, defense: 8, magic: 8, difficulty: 8} },
    { id: 'Herald', name: 'Rift Herald', title: 'Void Creature', tags: ['Objective'], info: {attack: 7, defense: 9, magic: 3, difficulty: 6} },
    { id: 'Blue', name: 'Blue Sentinel', title: 'Mana Guardian', tags: ['Objective'], info: {attack: 3, defense: 5, magic: 7, difficulty: 2} },
    { id: 'Red', name: 'Red Brambleback', title: 'Buff Monster', tags: ['Objective'], info: {attack: 6, defense: 5, magic: 2, difficulty: 2} },
    { id: 'Gromp', name: 'Gromp', title: 'Ancient Frog', tags: ['Objective'], info: {attack: 4, defense: 6, magic: 3, difficulty: 1} },
    { id: 'Krugs', name: 'Ancient Krug', title: 'Stone Golem', tags: ['Objective'], info: {attack: 5, defense: 8, magic: 1, difficulty: 2} },
    { id: 'Raptors', name: 'Crimson Raptor', title: 'Swift Bird', tags: ['Objective'], info: {attack: 4, defense: 3, magic: 2, difficulty: 2} },
    { id: 'Wolves', name: 'Greater Murk Wolf', title: 'Pack Leader', tags: ['Objective'], info: {attack: 4, defense: 4, magic: 2, difficulty: 2} },
    { id: 'Scuttle', name: 'Rift Scuttler', title: 'Passive Crab', tags: ['Objective'], info: {attack: 1, defense: 2, magic: 1, difficulty: 1} }
];

// Render champion grid
function renderChampions() {
    console.log('Rendering', filteredChampions.length, 'champions');
    const grid = document.getElementById('championGrid');
    grid.innerHTML = '';
    
    if (filteredChampions.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: white; font-size: 1.2em;">No champions found</div>';
        return;
    }
    
    filteredChampions.forEach(champ => {
        const card = document.createElement('div');
        card.className = 'champion-card';
        card.onclick = () => showChampionDetails(champ);
        
        // Check if it's an objective or champion
        const isObjective = champ.tags && champ.tags.includes('Objective');
        let imgUrl;
        
        if (isObjective) {
            // Use placeholder for objectives with emoji
            const objectiveEmojis = {
                'Baron': '🐉',
                'Dragon': '🐲',
                'Herald': '👁️',
                'Blue': '💙',
                'Red': '❤️',
                'Gromp': '🐸',
                'Krugs': '🗿',
                'Raptors': '🦅',
                'Wolves': '🐺',
                'Scuttle': '🦀'
            };
            imgUrl = `https://via.placeholder.com/180x180/667eea/ffffff?text=${objectiveEmojis[champ.id] || '🎯'}`;
        } else {
            imgUrl = `https://ddragon.leagueoflegends.com/cdn/${currentVersion}/img/champion/${champ.id}.png`;
        }
        
        const tags = champ.tags || [];
        const tagsHtml = tags.map(tag => `<span class="tag tag-${tag.toLowerCase()}">${tag}</span>`).join('');
        
        card.innerHTML = `
            <img src="${imgUrl}" alt="${champ.name}" class="champion-img" loading="lazy" onerror="this.src='https://via.placeholder.com/180x180?text=${champ.name}'">
            <div class="champion-info">
                <div class="champion-name">${champ.name}</div>
                <div class="champion-title">${champ.title || ''}</div>
                <div class="champion-tags">${tagsHtml}</div>
            </div>
        `;
        
        grid.appendChild(card);
    });
    
    console.log('Rendered', grid.children.length, 'champion cards');
}

// Show champion details in modal
async function showChampionDetails(champion) {
    try {
        const response = await fetch(`https://ddragon.leagueoflegends.com/cdn/${currentVersion}/data/en_US/champion/${champion.id}.json`);
        const data = await response.json();
        const champ = data.data[champion.id];
        
        const modal = document.getElementById('championModal');
        const header = document.getElementById('modalHeader');
        const body = document.getElementById('modalBody');
        
        const splashUrl = `https://ddragon.leagueoflegends.com/cdn/img/champion/splash/${champ.id}_0.jpg`;
        header.style.backgroundImage = `url('${splashUrl}')`;
        
        // Get passive and abilities
        const passive = champ.passive;
        const spells = champ.spells || [];
        
        // Build abilities HTML with embedded video iframes
        const passiveHtml = passive ? `
            <div style="margin-bottom: 20px;">
                <h3 style="color: #667eea; margin-bottom: 15px;">Passive</h3>
                <div style="display: flex; gap: 15px; align-items: start; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
                        <img src="https://ddragon.leagueoflegends.com/cdn/${currentVersion}/img/passive/${passive.image.full}" 
                             style="width: 64px; height: 64px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);" alt="${passive.name}">
                        <button onclick="loadAbilityVideo('${champ.name}', 'passive', '${passive.name}', 'passive-video')" 
                                style="background: #FF0000; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; white-space: nowrap;">
                            ▶ Load Video
                        </button>
                    </div>
                    <div style="flex: 1;">
                        <div style="font-weight: bold; font-size: 16px; margin-bottom: 5px;">${passive.name}</div>
                        <div style="font-size: 13px; color: #666; line-height: 1.6; margin-bottom: 10px;">${passive.description}</div>
                        <div id="passive-video" style="display: none; margin-top: 10px;">
                            <iframe width="100%" height="200" frameborder="0" allowfullscreen style="border-radius: 8px;"></iframe>
                        </div>
                    </div>
                </div>
            </div>
        ` : '';
        
        const abilitiesHtml = spells.map((spell, idx) => {
            const keys = ['Q', 'W', 'E', 'R'];
            const videoId = `${keys[idx]}-video`;
            return `
                <div style="display: flex; gap: 15px; align-items: start; padding: 15px; background: #f8f9fa; border-radius: 8px; margin-bottom: 10px;">
                    <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
                        <img src="https://ddragon.leagueoflegends.com/cdn/${currentVersion}/img/spell/${spell.image.full}" 
                             style="width: 64px; height: 64px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);" alt="${spell.name}">
                        <button onclick="loadAbilityVideo('${champ.name}', '${keys[idx]}', '${spell.name}', '${videoId}')" 
                                style="background: #FF0000; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 11px; font-weight: bold; white-space: nowrap;">
                            ▶ Load Video
                        </button>
                    </div>
                    <div style="flex: 1;">
                        <div style="font-weight: bold; font-size: 16px; margin-bottom: 5px;">
                            <span style="display: inline-block; background: #667eea; color: white; width: 24px; height: 24px; text-align: center; line-height: 24px; border-radius: 4px; font-size: 14px; margin-right: 8px;">${keys[idx]}</span>
                            ${spell.name}
                        </div>
                        <div style="font-size: 13px; color: #666; margin-bottom: 8px; line-height: 1.6;">${spell.description}</div>
                        <div style="display: flex; gap: 15px; font-size: 12px; color: #888; margin-bottom: 10px;">
                            ${spell.cooldown && spell.cooldown[0] ? `<span>⏱️ Cooldown: ${spell.cooldown.join('/')}</span>` : ''}
                            ${spell.cost && spell.cost[0] ? `<span>💧 Cost: ${spell.cost.join('/')}</span>` : ''}
                            ${spell.range && spell.range[0] ? `<span>📏 Range: ${spell.range.join('/')}</span>` : ''}
                        </div>
                        <div id="${videoId}" style="display: none; margin-top: 10px;">
                            <iframe width="100%" height="200" frameborder="0" allowfullscreen style="border-radius: 8px;"></iframe>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
        
        // Build stats HTML
        const stats = champ.stats;
        const statsHtml = `
            <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px;">

function closeModal() {

// Game mode tab switching
function switchGameMode(mode, champId) {
    // Hide all build contents
    document.querySelectorAll('.build-content').forEach(content => {
        content.style.display = 'none';
    });
    
    // Reset all tab styles
    document.querySelectorAll('[id^="tab-"]').forEach(tab => {
        tab.style.background = '#e0e0e0';
        tab.style.color = '#666';
    });
    
    // Show selected content and highlight tab
    document.getElementById(`build-${mode}`).style.display = 'block';
    document.getElementById(`tab-${mode}`).style.background = '#667eea';
    document.getElementById(`tab-${mode}`).style.color = 'white';
}

// Helper functions for build recommendations
function getMaxOrder(tags) {
    if (tags.includes('Mage')) return 'Q > W > E';
    if (tags.includes('Assassin')) return 'Q > E > W';
    if (tags.includes('Marksman')) return 'Q > W > E';
    if (tags.includes('Fighter')) return 'Q > E > W';
    if (tags.includes('Tank')) return 'W > Q > E';
    if (tags.includes('Support')) return 'E > W > Q';
    return 'Q > W > E';
}

function getAramMaxOrder(tags) {
    if (tags.includes('Mage')) return 'Q > W > E (Poke)';
    if (tags.includes('Marksman')) return 'Q > E > W';
    if (tags.includes('Tank')) return 'W > E > Q';
    return 'Q > W > E';
}

function getArenaAbilities(tags) {
    if (tags.includes('Assassin')) return 'Burst combos (Q+E+R)';
    if (tags.includes('Fighter')) return 'Sustained DPS';
    if (tags.includes('Mage')) return 'Burst rotation';
    return 'Damage abilities';
}

// Load ability video function
async function loadAbilityVideo(champName, key, abilityName, containerId) {
    const container = document.getElementById(containerId);
    const iframe = container.querySelector('iframe');
    const button = event.target;
    
    if (container.style.display === 'none') {
        // Show loading state
        button.textContent = '⏳ Loading...';
        button.disabled = true;
        
        try {
            // Search query for the ability
            const searchQuery = `${champName} ${key} ${abilityName} ability League of Legends`;
            const apiKey = 'AIzaSyCPIp7XLzIm6bEr7mnMDNX9kvW0brDT2LE';
            
            // Call YouTube API to search for videos with videoEmbeddable filter
            const response = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(searchQuery)}&type=video&videoEmbeddable=true&maxResults=5&key=${apiKey}`);
            const data = await response.json();
            
            console.log('YouTube API response:', data);
            
            if (data.items && data.items.length > 0) {
                // Try the first embeddable video
                let videoId = data.items[0].id.videoId;
                
                // Alternative: use nocookie domain for better privacy/embedding
                iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?rel=0`;
                container.style.display = 'block';
                button.textContent = '✖ Hide Video';
                button.style.background = '#666';
                button.disabled = false;
                
                console.log('Loaded video:', videoId);
            } else {
                // No embeddable results found, show message
                container.innerHTML = `
                    <div style="padding: 15px; background: #fff3cd; border-radius: 8px; margin-top: 10px;">
                        <p style="margin: 0; color: #856404;">
                            No embeddable videos found. 
                            <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(searchQuery)}" 
                               target="_blank" 
                               style="color: #667eea; text-decoration: underline;">
                                Search on YouTube
                            </a>
                        </p>
                    </div>
                `;
                container.style.display = 'block';
                button.textContent = '✖ Close';
                button.style.background = '#666';
                button.disabled = false;
            }
        } catch (error) {
            console.error('Error loading video:', error);
            // Show error message with link to YouTube
            const searchQuery = `${champName} ${key} ${abilityName} ability League of Legends`;
            container.innerHTML = `
                <div style="padding: 15px; background: #f8d7da; border-radius: 8px; margin-top: 10px;">
                    <p style="margin: 0; color: #721c24;">
                        Error loading video. 
                        <a href="https://www.youtube.com/results?search_query=${encodeURIComponent(searchQuery)}" 
                           target="_blank" 
                           style="color: #667eea; text-decoration: underline;">
                            Search on YouTube
                        </a>
                    </p>
                </div>
            `;
            container.style.display = 'block';
            button.textContent = '✖ Close';
            button.style.background = '#666';
            button.disabled = false;
        }
    } else {
        // Hide video and stop playback
        iframe.src = '';
        // Reset container to have iframe
        container.innerHTML = '<iframe width="100%" height="200" frameborder="0" allowfullscreen style="border-radius: 8px;"></iframe>';
        container.style.display = 'none';
        button.textContent = '▶ Load Video';
        button.style.background = '#FF0000';
        button.disabled = false;
    }
}

// Filter and sort functions
function filterChampions() {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const hideNames = document.getElementById('hideNames').checked;
    
    // Get show filter (champions, objectives, both)
    const showFilter = document.querySelector('input[name="show"]:checked').value;
    
    // Get selected lanes
    const selectedLanes = Array.from(document.querySelectorAll('.lane-filter:checked')).map(cb => cb.value);
    
    // Get range filter
    const rangeFilter = document.querySelector('input[name="range"]:checked').value;
    
    // Get damage filter
    const damageFilter = document.querySelector('input[name="damage"]:checked').value;
    
    // Combine champions and objectives based on show filter
    let dataToFilter = [];
    if (showFilter === 'champions') {
        dataToFilter = [...allChampions];
    } else if (showFilter === 'objectives') {
        dataToFilter = [...objectives];
    } else { // both
        dataToFilter = [...allChampions, ...objectives];
    }
    
    filteredChampions = dataToFilter.filter(champ => {
        // Search filter
        const matchesSearch = champ.name.toLowerCase().includes(search) || 
                            champ.title.toLowerCase().includes(search) ||
                            champ.id.toLowerCase().includes(search);
        
        // Skip other filters for objectives
        if (champ.tags && champ.tags.includes('Objective')) {
            return matchesSearch;
        }
        
        // Lane filter - for now using tags as proxy (all pass if any lane selected)
        const matchesLane = selectedLanes.length > 0;  // Simplified for now
        
        // Range filter - using partype if available
        let matchesRange = true;
        if (rangeFilter === 'melee') {
            matchesRange = champ.partype !== 'Mana' || champ.tags.includes('Fighter') || champ.tags.includes('Tank');
        } else if (rangeFilter === 'ranged') {
            matchesRange = champ.tags.includes('Marksman') || champ.tags.includes('Mage');
        }
        
        // Damage filter - using tags as proxy
        let matchesDamage = damageFilter === 'all';
        if (damageFilter === 'ad') {
            matchesDamage = champ.tags.includes('Marksman') || champ.tags.includes('Assassin') || champ.tags.includes('Fighter');
        } else if (damageFilter === 'ap') {
            matchesDamage = champ.tags.includes('Mage');
        } else if (damageFilter === 'hybrid') {
            matchesDamage = champ.tags.some(tag => ['Fighter', 'Assassin', 'Support'].includes(tag));
        }
        
        return matchesSearch && matchesLane && matchesRange && matchesDamage;
    });
    
    // Toggle name visibility
    const grid = document.getElementById('championGrid');
    if (hideNames) {
        grid.classList.add('hide-names');
    } else {
        grid.classList.remove('hide-names');
    }
    
    sortChampions();
}

function sortChampions() {
    const sortBy = document.getElementById('sortSelect').value;
    
    filteredChampions.sort((a, b) => {
        let result = 0;
        switch(sortBy) {
            case 'name': 
                result = a.name.localeCompare(b.name);
                break;
            case 'attack': result = a.info.attack - b.info.attack; break;
            case 'defense': result = a.info.defense - b.info.defense; break;
            case 'magic': result = a.info.magic - b.info.magic; break;
            case 'difficulty': result = a.info.difficulty - b.info.difficulty; break;
            default: return 0;
        }
        return isAscending ? result : -result;
    });
    
    renderChampions();
    updateStats();
}

function updateStats() {
    document.getElementById('championCount').textContent = 
        `Showing ${filteredChampions.length} of ${allChampions.length} champions`;
}

function updateGridSize() {
    const colsInput = document.getElementById('colsInput');
    if (!colsInput) {
        console.error('colsInput element not found');
        return;
    }
    
    const cols = parseInt(colsInput.value) || 10;
    console.log('Updating grid size to', cols, 'columns');
    
    const grid = document.getElementById('championGrid');
    if (grid) {
        // Use repeat with fixed columns instead of auto-fill
        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        console.log('Grid updated to', cols, 'columns');
        
        // Scale down content as columns increase
        const scale = Math.max(0.6, 1 - (cols - 10) * 0.05); // Scale from 1.0 down to 0.6
        
        // Apply scaling to all champion cards
        const cards = document.querySelectorAll('.champion-card');
        cards.forEach(card => {
            const info = card.querySelector('.champion-info');
            const name = card.querySelector('.champion-name');
            const title = card.querySelector('.champion-title');
            const tags = card.querySelectorAll('.tag');
            
            if (info) {
                info.style.padding = `${12 * scale}px`;
            }
            if (name) {
                name.style.fontSize = `${16 * scale}px`;
            }
            if (title) {
                title.style.fontSize = `${12 * scale}px`;
            }
            tags.forEach(tag => {
                tag.style.fontSize = `${11 * scale}px`;
                tag.style.padding = `${3 * scale}px ${8 * scale}px`;
            });
        });
    } else {
        console.error('championGrid element not found');
    }
}

function toggleAscDesc() {
    isAscending = !isAscending;
    const btn = document.getElementById('ascDescBtn');
    btn.textContent = isAscending ? 'Asc' : 'Desc';
    sortChampions();
}

// Event listeners
document.getElementById('searchInput').addEventListener('input', filterChampions);

document.getElementById('hideNames').addEventListener('change', filterChampions);
