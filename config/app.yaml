# CameronPAD Application Configuration

# Application settings
debug: false
environment: development
host: 0.0.0.0
port: 8000
reload: false

# Upload settings
upload_dir: data/uploads
max_upload_size: 10485760  # 10MB
allowed_file_types:
  - .jpg
  - .jpeg
  - .png
  - .gif
  - .pdf
  - .txt
  - .md

# Database configuration
database:
  url: sqlite:///data/app.db
  pool_size: 5
  max_overflow: 10
  echo: false
  migrate_on_startup: true

# Security configuration
security:
  secret_key: ""  # Will be generated in development, required in production
  algorithm: HS256
  access_token_expire_minutes: 30
  password_min_length: 8
  max_login_attempts: 5
  login_lockout_minutes: 15
  cors_origins:
    - "*"
  rate_limit_requests: 100
  rate_limit_period: 60

# Cache configuration
cache:
  backend: memory  # memory, redis
  redis_url: null
  default_ttl: 300
  max_keys: 1000

# Logging configuration
logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_path: null
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Plugin system configuration
plugins:
  plugins_dir: plugins
  config_dir: config
  auto_load: true
  enable_hot_reload: false

# API configuration
api:
  title: CameronPAD API
  description: Personal productivity and tracking application
  version: "2.0.0"
  docs_url: /docs
  redoc_url: /redoc
  openapi_url: /openapi.json
  enable_docs: true